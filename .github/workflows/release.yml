# .github/workflows/release.yml
#
# Builds release binaries for all supported platforms and uploads them to
# a GitHub Release whenever a version tag is pushed.
#
# Trigger:
#   git tag v0.1.0
#   git push origin v0.1.0
#
# Produces per-release assets:
#   vledger-v0.1.0-linux-x86_64.tar.gz
#   vledger-v0.1.0-linux-aarch64.tar.gz
#   vledger-v0.1.0-macos-x86_64.tar.gz
#   vledger-v0.1.0-macos-aarch64.tar.gz
#   vledger-v0.1.0-checksums.txt
#   vledger-v0.1.0-checksums.txt.sig    ← cosign signature over checksums
#   vledger-v0.1.0-sbom.cdx.json        ← CycloneDX SBOM
#   vledger-v0.1.0-sbom.cdx.json.sig    ← cosign signature over SBOM

name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write     # create and upload release assets
  id-token:  write    # required by cosign for keyless signing (OIDC)

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:

  # ── Build matrix ─────────────────────────────────────────────────────────
  build:
    name: Build — ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target:   x86_64-unknown-linux-gnu
            os:       ubuntu-22.04
            platform: linux-x86_64
            cross:    false

          - target:   aarch64-unknown-linux-gnu
            os:       ubuntu-22.04
            platform: linux-aarch64
            cross:    true

          - target:   x86_64-apple-darwin
            os:       macos-13
            platform: macos-x86_64
            cross:    false

          - target:   aarch64-apple-darwin
            os:       macos-14
            platform: macos-aarch64
            cross:    false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross (ARM64 Linux only)
        if: matrix.cross
        run: cargo install cross --version "0.2.5" --locked

      - name: Build (native)
        if: "!matrix.cross"
        run: cargo build --release --package vledger --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --package vledger --target ${{ matrix.target }}

      - name: Strip binary (Linux)
        if: runner.os == 'Linux'
        run: strip target/${{ matrix.target }}/release/vledger || true

      - name: Strip binary (macOS)
        if: runner.os == 'macOS'
        run: strip target/${{ matrix.target }}/release/vledger || true

      - name: Package archive
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME}"
          PLATFORM="${{ matrix.platform }}"
          ARCHIVE="vledger-${VERSION}-${PLATFORM}.tar.gz"
          cp target/${{ matrix.target }}/release/vledger ./vledger
          tar -czf "${ARCHIVE}" vledger
          rm -f vledger
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

      - name: Upload archive artefact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: ${{ env.ARCHIVE }}
          retention-days: 1

  # ── SBOM generation ───────────────────────────────────────────────────────
  # Generates a CycloneDX Software Bill of Materials from Cargo.lock.
  # cargo-cyclonedx produces a machine-readable SBOM that auditors and
  # vulnerability scanners (Grype, OSV-Scanner, Dependency-Track) can ingest.
  sbom:
    name: Generate SBOM (CycloneDX)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --version "0.5.9" --locked

      - name: Generate SBOM
        run: |
          VERSION="${GITHUB_REF_NAME}"
          # Generate workspace-level CycloneDX JSON SBOM.
          cargo cyclonedx --format json --all --output-cdx
          # cargo-cyclonedx writes bom.json by default; rename to versioned name.
          mv bom.json "vledger-${VERSION}-sbom.cdx.json"
          echo "SBOM=vledger-${VERSION}-sbom.cdx.json" >> "$GITHUB_ENV"

      - name: Upload SBOM artefact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: ${{ env.SBOM }}
          retention-days: 1

  # ── Checksums + signed releases + GitHub Release ──────────────────────────
  release:
    name: Create GitHub Release
    needs: [build, sbom]
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all build artefacts
        uses: actions/download-artifact@v4
        with:
          path: ./dist
          merge-multiple: true

      # ── SHA-256 checksums ─────────────────────────────────────────────────
      - name: Generate checksums.txt
        working-directory: ./dist
        run: |
          VERSION="${GITHUB_REF_NAME}"
          CHECKSUM_FILE="vledger-${VERSION}-checksums.txt"
          sha256sum vledger-*.tar.gz "vledger-${VERSION}-sbom.cdx.json" \
            > "${CHECKSUM_FILE}"
          echo "Generated checksums:"
          cat "${CHECKSUM_FILE}"

      # ── Cosign keyless signing (Task #17) ─────────────────────────────────
      # Signs the checksums file and SBOM using sigstore's keyless signing
      # (GitHub Actions OIDC identity).  Verifiers can check:
      #   cosign verify-blob \
      #     --certificate vledger-v0.1.0-checksums.txt.sig.pem \
      #     --signature   vledger-v0.1.0-checksums.txt.sig \
      #     vledger-v0.1.0-checksums.txt
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v3.1.3'

      - name: Sign checksums.txt
        working-directory: ./dist
        run: |
          VERSION="${GITHUB_REF_NAME}"
          CHECKSUM_FILE="vledger-${VERSION}-checksums.txt"
          cosign sign-blob \
            --yes \
            --output-signature "${CHECKSUM_FILE}.sig" \
            --output-certificate "${CHECKSUM_FILE}.sig.pem" \
            "${CHECKSUM_FILE}"

      - name: Sign SBOM
        working-directory: ./dist
        run: |
          VERSION="${GITHUB_REF_NAME}"
          SBOM_FILE="vledger-${VERSION}-sbom.cdx.json"
          cosign sign-blob \
            --yes \
            --output-signature "${SBOM_FILE}.sig" \
            --output-certificate "${SBOM_FILE}.sig.pem" \
            "${SBOM_FILE}"

      # ── GitHub Release ────────────────────────────────────────────────────
      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/vledger-*.tar.gz
            dist/vledger-*-checksums.txt
            dist/vledger-*-checksums.txt.sig
            dist/vledger-*-checksums.txt.sig.pem
            dist/vledger-*-sbom.cdx.json
            dist/vledger-*-sbom.cdx.json.sig
            dist/vledger-*-sbom.cdx.json.sig.pem
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
