[package]
name        = "vledger-wal"
description = "Append-only Write-Ahead Log with crash recovery and fsync durability"
version.workspace     = true
edition.workspace     = true
authors.workspace     = true
license.workspace     = true
repository.workspace  = true

[features]
# Enable the NoSync WAL sync mode.
#
# NoSync never calls fsync — any crash between a COMMIT and the next OS
# writeback permanently loses those committed transactions.  This feature
# is intentionally absent from release builds.
#
# Usage: cargo build --features vledger-wal/dev-no-sync
#        cargo test   --features vledger-wal/dev-no-sync
#
# The feature is automatically activated by the `vledger` binary crate when
# its own `dev-no-sync` feature is present, and by the fuzz crate.
dev-no-sync = []

[dependencies]
vledger-crypto = { workspace = true }
serde          = { workspace = true }
bincode        = { workspace = true }
thiserror      = { workspace = true }
tracing        = { workspace = true }
chrono         = { workspace = true }
uuid           = { workspace = true }
crc32fast      = { workspace = true }
tokio          = { workspace = true }
tokio-util     = { workspace = true }
aes-gcm        = { workspace = true }
hkdf           = { workspace = true }
sha2           = { workspace = true }
rand           = { workspace = true }
rand_core      = { workspace = true }
ed25519-dalek  = { workspace = true }
hex            = { workspace = true }
blake3         = { workspace = true }

[dev-dependencies]
tempfile = "3.20.0"
proptest = { workspace = true }
